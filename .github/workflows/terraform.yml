name: Terraform GCP Infrastructure Deployment

on:
  push:
    branches:
      - main
      - DEV
    paths:
      - 'terraform-infra/dev/**'
      - 'terraform-modules/**'
      - '.github/workflows/**'

  workflow_dispatch:

env:
  TF_VERSION: 1.6.6
  GCP_PROJECT_ID: innova-d365-gcp-project
  REGION: us-central1

jobs:
  terraform:
    name: Terraform Apply (Dev)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform-infra/dev

    steps:
      # 1️⃣ Checkout Repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Show Branch + Commit (DEBUG)
      - name: Debug Branch and Commit
        run: |
          echo "Current Branch:"
          git branch
          echo "Current Commit:"
          git rev-parse HEAD

      # 3️⃣ Show Terraform Files Being Executed (DEBUG)
      - name: Debug Terraform Files
        run: |
          echo "----- cloudsql.tf -----"
          cat cloudsql.tf || true
          echo "----- Module main.tf -----"
          cat ../../terraform-modules/cloudsql/main.tf || true
          echo "----- Module outputs.tf -----"
          cat ../../terraform-modules/cloudsql/outputs.tf || true

      # 4️⃣ Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 5️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 6️⃣ Clean Previous Terraform Cache (Prevents Stale Module Issues)
      - name: Clean Terraform Cache
        run: |
          rm -rf .terraform
          rm -f terraform.lock.hcl

      # 7️⃣ Terraform Init
      - name: Terraform Init
        run: terraform init -upgrade

      # 8️⃣ Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 9️⃣ Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 🔟 Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan